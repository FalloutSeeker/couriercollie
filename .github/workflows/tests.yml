# The unit tests, on every pull request and on main. (The container suites in devtools/ run by hand before a release:
# they need podman, real projects and hours.)
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Libraries Qt needs
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Python packages
        run: pip install PySide6 pytest
      - name: Unit tests
        run: python -m pytest -q tests
