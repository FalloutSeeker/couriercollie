# The unit tests, on every pull request and on main: on each distro couriercollie has a package for, with that
# distro's own Python and PySide6 (what the package uses). The container suites in devtools/ run by hand before a
# release: they need podman, real projects and hours.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: registry.fedoraproject.org/fedora:44
            install: dnf install -y -q git python3 python3-pyside6 python3-pytest shadow-utils util-linux
          - distro: opensuse
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            install: zypper -q --non-interactive install git python3 python3-pyside6 python3-pytest shadow util-linux
          - distro: debian
            image: docker.io/library/debian:trixie
            install: >-
              apt-get update -q && apt-get install -y -q git python3 python3-pytest python3-pyside6.qtcore
              python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qtqml python3-pyside6.qtquick
              python3-pyside6.qtdbus python3-pyside6.qtnetwork python3-pyside6.qtsvg qml6-module-qtquick
              qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window
          - distro: ubuntu
            image: docker.io/library/ubuntu:26.04
            install: >-
              apt-get update -q && apt-get install -y -q git python3 python3-pytest python3-pyside6.qtcore
              python3-pyside6.qtgui python3-pyside6.qtwidgets python3-pyside6.qtqml python3-pyside6.qtquick
              python3-pyside6.qtdbus python3-pyside6.qtnetwork python3-pyside6.qtsvg qml6-module-qtquick
              qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window
          - distro: arch
            image: docker.io/library/archlinux:latest
            install: pacman -Syu --noconfirm --quiet git python pyside6 python-pytest
    container: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Python, PySide6 and git, from the distro
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      # As a person, not root: root ignores permissions, which some tests check (a read-only folder, someone else's
      # clone).
      - name: Unit tests
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
          su tester -c "cd '$GITHUB_WORKSPACE' && QT_QPA_PLATFORM=offscreen python3 -m pytest -q -p no:cacheprovider tests"
