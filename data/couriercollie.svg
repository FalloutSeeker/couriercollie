<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- couriercollie: a project's branch, inside the circling arrows of an update. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb8f0"/>
      <stop offset="1" stop-color="#1f6fb2"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#tile)"/>
  <!-- update arrows: two arcs of one circle, each ending in a head -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <path d="M 98.8 54.7 A 36 36 0 0 0 32.8 46"/>
    <path d="M 29.2 73.3 A 36 36 0 0 0 95.2 82"/>
  </g>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <path d="M 26.5 56.5 L 42.4 50.3 L 24.2 39.9 Z"/>
    <path d="M 101.5 71.5 L 85.6 77.7 L 103.8 88.1 Z"/>
  </g>
  <!-- a branch -->
  <g stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 56 49 L 56 80"/>
    <path d="M 73 54 C 73 67 56 63 56 74"/>
  </g>
  <g fill="#1f6fb2" stroke="#ffffff" stroke-width="5">
    <circle cx="56" cy="48" r="5.5"/>
    <circle cx="56" cy="82" r="5.5"/>
    <circle cx="73" cy="50" r="5.5"/>
  </g>
</svg>
